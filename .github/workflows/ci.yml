# FuTheme M1 自動檢查。M3 才加入 Release 打包。
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static:
    name: 規格、配色、JSON、PHP lint、WPCS
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 規格與配色對比
        run: python3 scripts/validate_spec.py
      - name: 配色產物與 tokens 一致
        run: python3 scripts/build_theme_styles.py --check
      - name: JSON 格式
        run: for f in themes/futheme-core/theme.json themes/futheme-core/styles/*.json themes/futheme-core/styles/sections/*.json; do python3 -m json.tool "$f" > /dev/null; done
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      - name: PHP lint
        run: find themes/futheme-core tests/env -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: WPCS
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction wp-coding-standards/wpcs:^3
          ~/.composer/vendor/bin/phpcs --standard=phpcs.xml.dist
  wordpress:
    name: WordPress 7.1.4 安裝與前台／編輯器實測
    runs-on: ubuntu-24.04
    needs: static
    env:
      FUTHEME_PORT: '8890'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite, gd
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安裝 Playwright
        run: npm install --no-save playwright@1 && npx playwright install --with-deps chromium
      - name: 打包並以上傳流程安裝 ZIP
        run: |
          scripts/package_theme.sh
          FUTHEME_LINK_THEME=0 tests/env/setup.sh
          php tests/env/zip-install.php .wp-test/site dist/futheme-core-*.zip
          php tests/env/seed.php .wp-test/site
      - name: 十套配色前台檢查
        run: |
          (tests/env/serve.sh > server.log 2>&1 &) && sleep 2
          for s in urban-blue tech-blue forest-green business-green warm-orange coral-red creative-purple graphite classic-gold aqua-blue; do
            php tests/env/set-variation.php .wp-test/site "$s" && node tests/e2e/frontend.js evidence "$s"
          done
          node tests/e2e/editor.js evidence
          test ! -s .wp-test/debug.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-evidence
          path: |
            evidence/
            dist/
            .wp-test/debug.log
